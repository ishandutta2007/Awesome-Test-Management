<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A2387;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E94057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F27121;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 48px sans-serif; fill: white; }
      .subtitle { font: 24px sans-serif; fill: white; opacity: 0.8; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .anim { animation: float 3s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15" ry="15"/>
  <text x="50%" y="45%" text-anchor="middle" class="title anim">Awesome Test Management</text>
  <text x="50%" y="70%" text-anchor="middle" class="subtitle">Curated list of the best tools</text>
</svg>
